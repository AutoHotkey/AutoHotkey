name: Build installer package

on:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      HAVE_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
        fetch-depth: 0
        filter: tree:0

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Build interpreter binaries
      run: |
        msbuild AutoHotkeyx.sln /m /p:Configuration=Release /p:Platform=Win32
        msbuild AutoHotkeyx.sln /m /p:Configuration=Release /p:Platform=Win32 /p:AhkBuildVariant=Installer
        msbuild AutoHotkeyx.sln /m /p:Configuration=Release /p:Platform=x64
        msbuild AutoHotkeyx.vcxproj /t:GitHubSetAhkVersion
    
    - name: Upload binaries for signing
      if: ${{ env.HAVE_SIGNPATH }}
      id: upload-unsigned-base
      uses: actions/upload-artifact@v7
      with:
        name: unsigned.zip
        path: bin\AutoHotkey*.exe
        overwrite: true

    - name: Submit signing request 1
      if: ${{ env.HAVE_SIGNPATH }}
      uses: signpath/github-action-submit-signing-request@v3
      with:
        api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
        organization-id: e7595040-74b9-4f72-b9aa-f58d938fabd8
        project-slug: AutoHotkey
        signing-policy-slug: test-signing
        github-artifact-id: '${{ steps.upload-unsigned-base.outputs.artifact-id }}'
        artifact-configuration-slug: AutoHotkey.exe
        wait-for-completion: true
        output-artifact-directory: packaging/content
        parameters: |
          version: "${{ env.AHK_VERSION }}"

    - name: Build help file
      timeout-minutes: 5
      run: bin\AutoHotkey32.exe help\compile_chm.ahk

    - name: Assemble setup exe
      timeout-minutes: 1
      run: bin\AutoHotkey32.exe packaging\make-setup.ahk
    
    - uses: actions/upload-artifact@v7
      with:
        name: AutoHotkey.zip
        path: |
          packaging/content/*
          !packaging/content/UX/tools/
        overwrite: true

    - id: upload-unsigned-setup
      uses: actions/upload-artifact@v7
      with:
        name: unsigned-setup.exe
        path: packaging/AutoHotkey_setup.exe
        overwrite: true
    
    - name: Submit signing request 2
      uses: signpath/github-action-submit-signing-request@v3
      if: ${{ env.HAVE_SIGNPATH }}
      with:
        api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
        organization-id: e7595040-74b9-4f72-b9aa-f58d938fabd8
        project-slug: AutoHotkey
        signing-policy-slug: test-signing
        github-artifact-id: '${{ steps.upload-unsigned-setup.outputs.artifact-id }}'
        artifact-configuration-slug: setup.exe
        wait-for-completion: true
        output-artifact-directory: packaging/signed
        parameters: |
          version: "${{ env.AHK_VERSION }}"

    - uses: actions/upload-artifact@v7
      if: ${{ env.HAVE_SIGNPATH }}
      with:
        name: AutoHotkey_setup.exe
        path: packaging/signed/AutoHotkey_setup.exe
        overwrite: true
